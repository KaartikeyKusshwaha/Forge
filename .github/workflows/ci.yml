name: Forge checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q --basetemp=.forge/pytest
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --extra dev --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:extension
      - run: pnpm test:background
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tests/feedback.e2e.cjs
      - run: node tests/integration-setup.e2e.cjs
      - name: Start local fixture service
        run: |
          uv run forge serve --with-worker > /tmp/forge.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/forge.log
          exit 1
      - run: pnpm test:extension
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-evidence
          path: test-results/
  runner-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest==8.3.5
      - run: python scripts/check-runner-isolation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-isolation-evidence
          path: test-results/
