name: Forge isolated check
run-name: forge-check ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      profile:
        required: true
        type: choice
        options: [python, typescript]
      snapshot:
        required: true
        type: string
      digest:
        required: true
        type: string
      source_repo:
        required: false
        type: string
      source_sha:
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global corepack@0.36.0
      - run: python -m pip install pytest==8.3.5
      - name: Check source as an unprivileged offline process
        env:
          FORGE_REQUEST_ID: ${{ inputs.request_id }}
          FORGE_PROFILE: ${{ inputs.profile }}
          FORGE_SNAPSHOT: ${{ inputs.snapshot }}
          FORGE_SNAPSHOT_DIGEST: ${{ inputs.digest }}
          FORGE_SOURCE_REPO: ${{ inputs.source_repo }}
          FORGE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python scripts/actions-check.py
      - uses: actions/upload-artifact@v4
        with:
          name: forge-check-${{ inputs.request_id }}
          path: test-results/result.json
          retention-days: 7
